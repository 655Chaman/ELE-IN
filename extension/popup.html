<!DOCTYPE html>
<html>
<head>
  <title>Ele-In Extension</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #09090b;
      color: #fafafa;
      margin: 0;
      padding: 16px;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
    }
    button {
      width: 100%;
      background: #fafafa;
      color: #09090b;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #f4f4f5;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
    }
    .success {
      color: #10b981;
    }
  </style>
</head>
<body>
  <h2>Ele-In Connection</h2>
  
  <div id="auth-section">
    <div class="input-group">
      <label>Sync Key (API Key)</label>
      <input type="password" id="sync-key" placeholder="ext_..." />
    </div>
    <div class="input-group">
      <label>Sender Account ID</label>
      <input type="text" id="account-id" placeholder="uuid-of-account..." />
    </div>
    <button id="save-btn">Connect Extension</button>
  </div>
  
  <div id="status-message" class="status">Waiting for connection...</div>

  <script src="popup.js"></script>
</body>
</html>
