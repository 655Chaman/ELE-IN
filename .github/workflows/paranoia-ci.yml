name: Paranoia CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Layer 1 - Security & Secret Leakage Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Security Tools
        run: pip install bandit trufflehog3
        
      - name: Run Bandit (Python Security)
        run: bandit -r . -x ./backend/venv,./node_modules -lll
        
      - name: Scan for Hardcoded Secrets
        run: trufflehog3 --no-entropy .

  build-backend:
    name: Layer 2 - Backend Build & Test
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run Tests with Coverage
        # If tests exist, run them. Otherwise, verify syntax.
        run: |
          if [ -d "campaigns/backend/tests" ]; then
            pytest campaigns/backend/tests/ --cov=./ --cov-report=xml
          else
            echo "No tests found, running Python compileall for syntax check"
            python -m compileall -q .
          fi

      - name: Build Backend Docker Image (Dry Run)
        run: docker build -t elein-backend:test -f backend/Dockerfile .

  build-frontend:
    name: Layer 2 - Frontend Build & Test
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Typecheck
        run: npm run typecheck --if-present
        
      - name: Build Frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://mock.supabase.co"
          VITE_SUPABASE_ANON_KEY: "mock_key"

      - name: Build Frontend Docker Image (Dry Run)
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="https://mock.supabase.co" \
            --build-arg VITE_SUPABASE_ANON_KEY="mock_key" \
            -t elein-frontend:test -f frontend/Dockerfile .

  deploy-gate:
    name: Layer 3 - Deployment Gateway
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deployment Authorization
        run: |
          echo "All Paranoia Framework checks passed."
          echo "Ready for CD integration (AWS/Render/Fly.io)."
